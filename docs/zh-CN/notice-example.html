<style>
.notice-card{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#26374f;background:#fff;border:1px solid #c6d8f2;border-radius:14px;overflow:hidden;box-shadow:0 7px 24px #1c3c6510}
.notice-card-header{display:flex;align-items:center;gap:17px;padding:24px 27px;background:linear-gradient(115deg,#153c70,#24589a);color:#fff}
.notice-card-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:48px;height:48px;border:1px solid #ffffff40;border-radius:11px;background:#ffffff13;font-size:27px;line-height:1;color:#ffda9a}
.notice-card-heading{display:flex;align-items:center;flex-wrap:wrap;gap:9px 12px;min-width:0}
.notice-card-heading h3{margin:0;color:#fff;font-size:24px;line-height:1.5;font-weight:750}
.notice-card-badge{padding:3px 10px;border-radius:5px;background:#ffd69a;color:#704313;font-size:12px;font-weight:750}
.notice-card-subtitle{flex-basis:100%;margin:0;color:#d5e4fa;font-size:13px;line-height:1.75}
.notice-card-body{padding:24px 27px 22px;font-size:15px;line-height:1.85}
.notice-card-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:15px;margin-bottom:20px;align-items:start}
.notice-card-row p{margin:0}.notice-card-label{border-left:3px solid #1b5db5;padding-left:10px;color:#1b4e91;font-weight:750;white-space:nowrap}
.notice-card-alert{color:#b7421e;font-weight:750}.notice-card-advice{padding:17px 18px;border-radius:10px;background:#edf4ff}.notice-card-advice .notice-card-label{border-color:#e68b21}.notice-card-advice strong,.notice-card-advice a{color:#174b8e;font-weight:750}
.notice-card-footer{padding-top:18px;border-top:1px solid #e2eaf5;color:#536177;font-size:13px;line-height:1.9}
@media(max-width:600px){.notice-card-header{padding:19px 17px;gap:12px;align-items:flex-start}.notice-card-icon{width:35px;height:38px;font-size:22px}.notice-card-heading h3{font-size:20px}.notice-card-body{padding:19px 17px;font-size:14px}.notice-card-row{grid-template-columns:1fr;gap:8px}.notice-card-advice{padding:14px}}
</style>
<div class="notice-card">
  <div class="notice-card-header">
    <span class="notice-card-icon">⚠</span>
    <div class="notice-card-heading">
      <span class="notice-card-badge">公告示例</span>
      <h3>线路波动与处理进展公告</h3>
      <p class="notice-card-subtitle">本条仅为样式示例，暂未发布；启用前请核对实际情况。</p>
    </div>
  </div>
  <div class="notice-card-body">
    <div class="notice-card-row">
      <span class="notice-card-label">当前影响</span>
      <p>如使用过程中遇到部分节点<span class="notice-card-alert">连接异常、速度下降或暂时无法使用</span>，请先参考下方建议处理。具体影响时间、线路和地区，请以当次公告说明为准。</p>
    </div>
    <div class="notice-card-row">
      <span class="notice-card-label">处理进展</span>
      <p>我们会根据反馈<strong>排查问题、调整线路</strong>，并及时补充处理进展。恢复状态和恢复时间，请以核实后的公告为准。</p>
    </div>
    <div class="notice-card-row notice-card-advice">
      <span class="notice-card-label">使用建议</span>
      <p>请先<strong>更新订阅并切换其他节点</strong>。若问题持续，请通过<a href="/#/ticket">我的工单</a>反馈<strong>节点名称、发生时间、客户端版本及错误截图</strong>，方便我们定位问题。</p>
    </div>
    <div class="notice-card-footer">对于线路波动可能给你带来的不便，我们深表歉意。感谢你的耐心等待、理解与支持！</div>
  </div>
</div>
