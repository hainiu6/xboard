name: aaPanel deployment checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n init.sh update.sh scripts/aapanel.sh
      - name: PHP syntax
        run: php -l scripts/backup-mysql.php
      - name: Isolated deployment flow
        run: python3 tests/aapanel_deploy_test.py
      - name: Theme JavaScript syntax
        run: node --check public/assets/126/portal.js
      - name: Plan catalog calculation and navigation
        run: node tests/plan_catalog_test.mjs
      - name: Install view rendering dependencies
        run: composer install --no-dev --no-scripts --no-interaction --prefer-dist
      - name: Render Blade theme
        run: php tests/render_theme.php
      - name: Publish default and custom frontend assets
        run: php tests/refresh_theme.php
